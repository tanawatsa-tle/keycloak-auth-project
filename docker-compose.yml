
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: auth-keycloak
    restart: unless-stopped

    command: start-dev --features=identity-brokering-api:v2

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      APP_REGISTRATION_URL: ${APP_REGISTRATION_URL:-http://localhost:3001/auth/register}

    ports:
      - "8080:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/themes/app-registration:/opt/keycloak/themes/app-registration:ro

volumes:
  keycloak_data:
